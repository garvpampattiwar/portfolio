<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Hexagon/Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="#090b10"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#glowGrad)" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Subtle Circuit Dots -->
  <circle cx="12" cy="12" r="1.5" fill="#00f5d4" opacity="0.6"/>
  <circle cx="52" cy="52" r="1.5" fill="#00b4d8" opacity="0.6"/>

  <!-- Monogram GP -->
  <g filter="url(#glowFilter)">
    <!-- Letter G -->
    <path d="M 28 20 C 19 20 15 25 15 32 C 15 39 19 44 28 44 C 33 44 36 41 37 38 L 37 33 L 27 33 L 27 28 L 42 28 L 42 39 C 39 46 34 49 27 49 C 15 49 9 41 9 32 C 9 22 16 15 28 15 C 34 15 39 17 42 21 L 37 25 C 35 22 32 20 28 20 Z" fill="url(#glowGrad)"/>
    <!-- Slash / Terminal Angle Symbol -->
    <path d="M 44 44 L 54 20" stroke="#00f5d4" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
