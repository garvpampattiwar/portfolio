<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f"/>
      <stop offset="50%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <radialGradient id="glowSpot" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowSpot)"/>

  <!-- Tech Grid Background lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Border Card -->
  <rect x="50" y="50" width="1100" height="530" rx="24" fill="none" stroke="#00f5d4" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Status pill -->
  <g transform="translate(100, 110)">
    <rect width="280" height="38" rx="19" fill="#00f5d4" fill-opacity="0.1" stroke="#00f5d4" stroke-opacity="0.3"/>
    <circle cx="20" cy="19" r="6" fill="#00f5d4"/>
    <text x="36" y="24" fill="#00f5d4" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="1">AVAILABLE FOR ROLES</text>
  </g>

  <!-- Name -->
  <text x="100" y="230" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">Garv Abhay Pampattiwar</text>

  <!-- Tagline -->
  <text x="100" y="295" fill="url(#accentGrad)" font-family="system-ui, sans-serif" font-size="28" font-weight="600">Computer Science Engineering Student</text>
  <text x="100" y="340" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="22" font-weight="400">Software Development · Cloud · Artificial Intelligence</text>

  <!-- Feature Pills -->
  <g transform="translate(100, 420)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="44" rx="10" fill="#131822" stroke="#2a3345"/>
    <text x="20" y="28" fill="#e2e8f0" font-family="monospace" font-size="16">Python / AI / RAG</text>

    <!-- Pill 2 -->
    <rect x="190" y="0" width="190" height="44" rx="10" fill="#131822" stroke="#2a3345"/>
    <text x="210" y="28" fill="#e2e8f0" font-family="monospace" font-size="16">LMS Full-Stack Dev</text>

    <!-- Pill 3 -->
    <rect x="400" y="0" width="190" height="44" rx="10" fill="#131822" stroke="#2a3345"/>
    <text x="420" y="28" fill="#e2e8f0" font-family="monospace" font-size="16">FastAPI + Supabase</text>

    <!-- Pill 4 -->
    <rect x="610" y="0" width="220" height="44" rx="10" fill="#131822" stroke="#2a3345"/>
    <text x="630" y="28" fill="#e2e8f0" font-family="monospace" font-size="16">NPTEL IIT-KGP Certified</text>
  </g>

  <!-- Location & Handle -->
  <g transform="translate(100, 520)">
    <text x="0" y="0" fill="#64748b" font-family="system-ui, sans-serif" font-size="18">📍 Ballarshah, Maharashtra, India</text>
    <text x="720" y="0" fill="#64748b" font-family="monospace" font-size="18">github.com/garvpampattiwar</text>
  </g>
</svg>
